name: Create Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tags
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG="v0.0.0"
          fi
          NEW_TAG="$(./scripts/bump-version.sh)"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG}"
          echo "New tag: ${NEW_TAG}"

      - name: Build release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/build-release-notes.sh
          ./scripts/build-release-notes.sh \
            "${{ steps.version.outputs.prev_tag }}" \
            "${{ steps.version.outputs.new_tag }}" \
            release-body.md
          echo "----- Release body -----"
          cat release-body.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"
          gh release create "${NEW_TAG}" \
            --repo "${{ github.repository }}" \
            --title "${NEW_TAG}" \
            --notes-file release-body.md
